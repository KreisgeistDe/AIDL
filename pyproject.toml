[build-system]
requires = [
  "setuptools==80.9.0",
  "wheel==0.45.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "aidl-toolchain"
version = "0.1.0rc1"
description = "Pre-release AIDL compiler and command line toolchain"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "attrs==26.1.0",
  "jsonschema==4.25.1",
  "jsonschema-specifications==2025.9.1",
  "referencing==0.37.0",
  "rpds-py==2026.6.3",
  "typing-extensions==4.16.0",
]

[project.scripts]
aidl = "tools.aidl_cli:main"

[tool.setuptools]
packages = ["tools", "spec"]
include-package-data = false

[tool.setuptools.package-data]
spec = ["*.json"]
