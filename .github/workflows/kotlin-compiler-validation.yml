name: Kotlin Compiler Skeleton

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kotlin-compiler:
    name: Compiler / Kotlin Skeleton
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            compiler/kotlin/*.gradle.kts
            plugins/intellij/gradle/wrapper/gradle-wrapper.properties

      - name: Verify inherited M10.5 contract boundary
        run: python3 -m unittest tools/test_m10_5_kotlin_skeleton.py

      - name: Run JVM tests and coverage gates
        run: plugins/intellij/gradlew -p compiler/kotlin --no-daemon jvmTest koverVerify koverXmlReport

      - name: Link Kotlin Native adapter
        run: plugins/intellij/gradlew -p compiler/kotlin --no-daemon linkReleaseExecutableLinuxX64
